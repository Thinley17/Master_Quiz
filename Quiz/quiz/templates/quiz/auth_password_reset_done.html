{% extends 'base.html' %}
{% block title %}Check Your Email | QuizMaster{% endblock %}
{% block content %}
<div class="auth-message">
    <i class="fas fa-envelope-open-text auth-message-icon"></i>
    <div class="eyebrow">Check your inbox</div>
    <h1>Reset instructions sent</h1>
    <p>If an account exists for that email, password-reset instructions are on the way.</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
</div>
{% endblock %}
