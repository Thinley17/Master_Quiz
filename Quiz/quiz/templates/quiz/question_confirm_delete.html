{% extends 'base.html' %}
{% block title %}Delete Question - QuizMaster{% endblock %}
{% block content %}
<div class="delete-card">
    <i class="fas fa-exclamation-triangle delete-icon-bubble" style="color:#dc3545;"></i>
    <h3 class="mt-3">Delete Question</h3>
    <p>Are you sure you want to delete the question: <strong>&ldquo;{{ question.text }}&rdquo;</strong>?</p>
    <form method="post" class="d-flex justify-content-center flex-wrap gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i> Yes, delete</button>
        <a href="{% url 'quiz:question_list' quiz.id %}" class="btn btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
