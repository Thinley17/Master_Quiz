{% extends 'base.html' %}
{% block title %}Choose New Password | QuizMaster{% endblock %}
{% block content %}
<div class="auth-message">
    <i class="fas fa-lock auth-message-icon"></i>
    <div class="eyebrow">Account recovery</div>
    <h1>Choose a new password</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3 text-start">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Update password</button>
    </form>
</div>
{% endblock %}
